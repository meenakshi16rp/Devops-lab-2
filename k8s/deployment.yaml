apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-app
  labels:
    app: lab2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab2-app
  template:
    metadata:
      labels:
        app: lab2-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: lab2-app
          image: ghcr.io/meenakshi16rp/devops-lab2-app:2.0.0
          ports:
            - containerPort: 5000
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: lab2-config
                  key: GREETING
